# Pipeline trimestral de generación de informes ganaderos
# autAnalisis — San Luis, Argentina
#
# Se ejecuta:
#   - Automáticamente cada 1° de enero, abril, julio, octubre
#   - Manualmente desde la pestaña Actions del repositorio
#
# Flujo: tests → datos → ETL → KPIs → informe

name: Informe Trimestral

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generar-informe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Generar datos
        run: uv run python src/generacion/generar_datos.py

      - name: Pipeline ETL
        run: uv run python src/etl/limpiar.py

      - name: Calcular KPIs
        run: uv run python src/analisis/kpis.py

      - name: Generar informe
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          uv run python src/reporte/generar_reporte.py --tipo anual --año $(date +%Y)

      - name: Listar resultados
        run: ls -lh reports/

      - uses: actions/upload-artifact@v4
        with:
          name: informes-${{ github.run_number }}
          path: reports/*.md
          retention-days: 90
